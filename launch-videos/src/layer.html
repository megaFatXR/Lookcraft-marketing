<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: 'Fraunces'; src: url('/Users/userv/Workspace/styleFit/StyleFit/Shared/Fonts/Fraunces-Medium.ttf'); font-weight: 500; }
@font-face { font-family: 'Fraunces'; src: url('/Users/userv/Workspace/styleFit/StyleFit/Shared/Fonts/Fraunces-Italic.ttf'); font-weight: 100 900; font-style: italic; }
@font-face { font-family: 'Hanken Grotesk'; src: url('/Users/userv/Workspace/styleFit/StyleFit/Shared/Fonts/HankenGrotesk.ttf'); font-weight: 100 900; }
:root { --cream: #f4efe9; --ink: #212121; --muted: #6b6560; --coral: #ec5965; }
* { box-sizing: border-box; margin: 0; }
html, body { overflow: hidden; background: transparent; color: var(--ink); font-family: 'Hanken Grotesk', sans-serif; -webkit-font-smoothing: antialiased; }
.band { width: 1080px; height: 540px; background: var(--cream); display: flex; flex-direction: column; justify-content: flex-end; align-items: center; text-align: center; padding: 0 60px 44px; }
.band h1 { font-family: 'Fraunces', serif; font-weight: 500; font-size: 92px; line-height: 1.02; letter-spacing: -0.02em; }
.band h1 em { font-style: italic; color: var(--coral); }
.band h2 { font-family: 'Fraunces', serif; font-weight: 500; font-size: 76px; line-height: 1.05; letter-spacing: -0.02em; }
.band p { margin-top: 16px; font-size: 38px; font-weight: 600; color: var(--muted); }
.band p strong { color: var(--ink); }
.photo { position: relative; overflow: hidden; }
.photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pill { position: absolute; left: 36px; padding: 12px 24px; border-radius: 999px; background: rgb(255 255 255 / 0.88); font-size: 32px; font-weight: 650; color: var(--ink); }
.cards { position: relative; width: 1080px; height: 1920px; }
.card { position: absolute; display: flex; align-items: center; gap: 18px; width: 390px; padding: 12px 18px 12px 12px; border-radius: 28px; background: #fff; box-shadow: 0 24px 44px -20px rgb(0 0 0 / 0.45); }
.card.left { left: 22px; } .card.right { right: 22px; }
.thumb { flex: none; width: 116px; height: 116px; border-radius: 18px; overflow: hidden; background: #f1ece6; }
.thumb img { width: 100%; height: 100%; object-fit: cover; }
.meta { min-width: 0; line-height: 1.15; }
.brand { font-size: 26px; font-weight: 600; color: var(--muted); }
.title { font-size: 31px; font-weight: 650; margin-top: 2px; }
.price { font-size: 31px; font-weight: 700; margin-top: 6px; }
.end { width: 1080px; height: 1920px; background: var(--cream); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 0; padding-bottom: 120px; }
.end .icon { width: 300px; height: 300px; border-radius: 68px; box-shadow: 0 30px 60px -30px rgb(0 0 0 / 0.4); }
.end h1 { margin-top: 56px; font-family: 'Fraunces', serif; font-weight: 500; font-size: 120px; letter-spacing: -0.02em; line-height: 1; }
.end .sub { margin-top: 18px; font-size: 46px; font-weight: 600; color: var(--muted); }
.end .badge { margin-top: 72px; height: 120px; }
.end .free { margin-top: 36px; font-size: 38px; font-weight: 600; }
.end .free em { font-style: normal; color: var(--coral); }
.band .hook1 { font-family: 'Fraunces', serif; font-weight: 500; font-size: 84px; line-height: 1.04; letter-spacing: -0.02em; }
.band .hook2 { text-wrap: balance; margin-top: 14px; font-family: 'Fraunces', serif; font-style: italic; font-weight: 500; font-size: 66px; line-height: 1.08; color: var(--coral); }
.band .hook2.hidden { visibility: hidden; }
.band .ask { font-size: 36px; font-weight: 650; color: var(--muted); }
.band .bubble { margin-top: 16px; padding: 22px 40px 24px; border-radius: 40px 40px 40px 12px; background: #fff; box-shadow: 0 16px 34px -20px rgb(0 0 0 / 0.35); }
.band .bubble q { display: block; font-family: 'Fraunces', serif; font-weight: 500; font-size: 66px; line-height: 1.05; letter-spacing: -0.02em; quotes: '“' '”'; }
.band .bubble small { display: block; margin-top: 10px; font-size: 34px; font-weight: 650; color: var(--coral); }
.pcard { position: absolute; left: 22px; display: flex; align-items: center; gap: 16px; max-width: 360px; padding: 8px 22px 8px 8px; border-radius: 26px; background: #fff; box-shadow: 0 20px 40px -20px rgb(0 0 0 / 0.5); }
.pcard img { flex: none; width: 112px; height: 112px; border-radius: 18px; object-fit: cover; object-position: 50% 30%; }
.pcard .shop { font-size: 27px; font-weight: 650; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
.pcard .cost { margin-top: 4px; font-size: 34px; font-weight: 750; }
.band .strip { display: flex; gap: 12px; margin-top: 26px; }
.band .strip span { width: 128px; height: 128px; padding: 6px; border-radius: 22px; background: #fff; box-shadow: 0 12px 26px -16px rgb(0 0 0 / 0.4); }
.band .strip img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; border-radius: 16px; }
.band .chip { display: inline-block; margin-bottom: 18px; padding: 10px 26px; border-radius: 999px; background: var(--ink); color: #fff; font-size: 34px; font-weight: 700; letter-spacing: 0.02em; }
.band .total { display: inline-block; margin-top: 18px; padding: 8px 26px; border-radius: 999px; background: var(--coral); color: #fff; font-size: 40px; font-weight: 750; }
.band .total span { font-weight: 600; opacity: 0.85; }
.sticker { position: absolute; left: 34px; top: 40px; padding: 18px 34px; border-radius: 22px; background: var(--coral); color: #fff; font-size: 48px; font-weight: 800; rotate: -4deg; box-shadow: 0 18px 36px -18px rgb(0 0 0 / 0.5); }
.frame { position: relative; width: 1080px; height: 1920px; }
.logo { position: absolute; right: 30px; top: 572px; display: flex; align-items: center; gap: 14px; padding: 10px 26px 10px 10px; border-radius: 999px; background: rgb(255 255 255 / 0.92); box-shadow: 0 14px 30px -16px rgb(0 0 0 / 0.45); }
.logo img { width: 64px; height: 64px; border-radius: 16px; }
.logo b { font-family: 'Fraunces', serif; font-weight: 500; font-size: 40px; letter-spacing: -0.01em; }
.inset { position: absolute; left: 34px; top: 1170px; width: 236px; padding: 10px 10px 0; background: #fff; border-radius: 18px; rotate: -5deg; box-shadow: 0 22px 40px -18px rgb(0 0 0 / 0.55); text-align: center; }
.inset img { display: block; width: 216px; height: 290px; object-fit: cover; border-radius: 10px; }
.inset span { display: block; padding: 10px 0 12px; font-size: 30px; font-weight: 750; }
.grid { position: absolute; left: 0; top: 540px; width: 1080px; height: 1380px; background: var(--cream); display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding: 116px 18px 0; align-content: start; }
.grid .cell { position: relative; height: 610px; border-radius: 26px; overflow: hidden; }
.grid .cell img { width: 100%; height: 100%; object-fit: cover; }
.grid .num { position: absolute; left: 16px; top: 16px; display: flex; align-items: center; gap: 12px; padding: 6px 20px 6px 6px; border-radius: 999px; background: rgb(255 255 255 / 0.92); font-size: 28px; font-weight: 700; }
.grid .num i { display: grid; place-items: center; width: 54px; height: 54px; border-radius: 50%; background: var(--coral); color: #fff; font-style: normal; font-size: 32px; font-weight: 800; }
</style>
</head>
<body>
<div id="root"></div>
<script>
const spec = JSON.parse(decodeURIComponent(location.hash.slice(1)));
const root = document.getElementById('root');
const photos = '/Users/userv/Workspace/styleFit/store-screenshots/photos/';
const assets = '/Users/userv/Workspace/lookeo-marketing/web/src/assets/';
if (spec.kind === 'band') {
	root.innerHTML = `<div class="band">${spec.html}</div>`;
} else if (spec.kind === 'photo') {
	root.innerHTML = `<div class="photo" style="width:1080px;height:${spec.h}px"><img src="${photos}${spec.src}.jpg" style="object-position:50% ${spec.y ?? 50}%">${spec.pill ? `<span class="pill" style="top:${spec.pillTop ?? 36}px">${spec.pill}</span>` : ''}${spec.sticker ? `<span class="sticker">${spec.sticker}</span>` : ''}</div>`;
} else if (spec.kind === 'pcard') {
	root.innerHTML = `<div class="frame"><div class="pcard" style="top:${spec.top}px"><img src="${spec.img}"><span><div class="shop">${spec.shop}</div><div class="cost">${spec.price}</div></span></div></div>`;
} else if (spec.kind === 'logo') {
	root.innerHTML = `<div class="frame"><span class="logo"><img src="${assets}icon.png"><b>Lookeo</b></span></div>`;
} else if (spec.kind === 'inset') {
	root.innerHTML = `<div class="frame"><span class="inset"><img src="${photos}${spec.src}.jpg"><span>${spec.label}</span></span></div>`;
} else if (spec.kind === 'grid') {
	root.innerHTML = `<div class="frame"><div class="band">${spec.band}</div><div class="grid">${spec.cells.map((c, i) => `<div class="cell"><img src="${photos}${c.src}.jpg"><span class="num"><i>${i + 1}</i>${c.title}</span></div>`).join('')}</div></div>`;
} else if (spec.kind === 'card') {
	const c = spec.card;
	root.innerHTML = `<div class="cards"><div class="card ${c.side}" style="top:${c.top}px"><span class="thumb"><img src="${assets}hero/${c.img}.webp"></span><span class="meta"><div class="brand">${c.brand}</div><div class="title">${c.title}</div><div class="price">${c.price}</div></span></div></div>`;
} else if (spec.kind === 'end') {
	root.innerHTML = `<div class="end"><img class="icon" src="${assets}icon.png"><h1>Lookeo</h1><div class="sub">Stylist &amp; Try On</div><img class="badge" src="${assets}app-store-badge.svg"><div class="free">${spec.free}</div></div>`;
}
</script>
</body>
</html>
